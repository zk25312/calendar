<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日历标记</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">📅</span>
        <div>
          <h1>日历标记</h1>
          <p id="todayInfo">加载中…</p>
        </div>
      </div>
      <div class="stats" id="stats">
        <div class="stat"><span class="num" id="statTotal">0</span><span class="label">累计标记(天)</span></div>
        <div class="stat"><span class="num" id="statMonth">0</span><span class="label">本月标记(天)</span></div>
      </div>
    </header>
    <div class="cal-card">
      <div class="cal-head">
        <button id="prevBtn" class="nav-btn" title="上个月">‹</button>
        <h2 id="monthTitle">----</h2>
        <button id="nextBtn" class="nav-btn" title="下个月">›</button>
        <button id="todayBtn" class="today-btn">今天</button>
      </div>
      <div class="week-row">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="weekend">六</span><span class="weekend">日</span>
      </div>
      <div class="grid" id="grid"></div>
      <p class="tip">💡 点击日期：标记 / 取消；多设备共享标记数据。</p>
    </div>
    <div class="list-card">
      <h3>累计标记明细</h3>
      <div id="markList" class="mark-list"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
